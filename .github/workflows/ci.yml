name: Reproduce evidence package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Sync locked environment
        working-directory: experiments
        run: uv sync --frozen
      - name: Run tests
        working-directory: experiments
        run: uv run pytest
      - name: Regenerate all evidence outputs
        working-directory: experiments
        run: uv run protocol-frontier run-all
